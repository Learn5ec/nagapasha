[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nagapasha"
version = "0.1.0"
description = "Adaptive AI-Powered Intruder — a multi-agent, self-scoping fuzzing tool"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-httpx>=0.30",
    "httpx<0.28",
]

[project.scripts]
nagapasha = "nagapasha.cli:app"

[tool.setuptools.packages.find]
include = ["nagapasha*", "dashboard*"]

[tool.setuptools.package-data]
dashboard = ["static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
